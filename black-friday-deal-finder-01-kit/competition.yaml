phases:
  - key: dev
    title: Development
    description: "While blind rounds are off, each valid entry is judged as it arrives against the four fixed house sites and 8 more games against the house sites nearest its strength, 8 more when its interval reaches the money-place line: its provisional rate, against house references only, shows at once with its 90% interval and its screenshots on the Feed. While blind rounds run, nothing is judged when an entry is sent: each round judges the field the way the final does, the first every entry so far whose grade has finished when its judging begins, each later one the latest judged round's top 80 and every entry that round does not rate. A provisional rate never counts in a final rate: it decides only which entries go on to the final heat, which judges each of them afresh."
    starts_at: 2026-11-27T00:42:00Z
    ends_at: 2026-11-29T00:42:00Z
    dataset: null
    scores: live
  - key: final
    title: Final
    description: "After the deadline the 80 entrants ranked highest on the development leaderboard, and any entry it does not rate, are screened on their development ratings and the shortlist is judged afresh in one heat: Swiss rounds, racing at the prize boundaries, then a playoff among the top 22, and the top 10 are held up to 60 minutes for the finalist review. Its rates appear with the results, published automatically once the final grades, the judge heat and the checks after them are done."
    starts_at: 2026-11-29T00:42:00Z
    ends_at: 2026-11-30T00:42:00Z
    dataset: null
    scores: after_finalize
