  description: |-
    Build the best real Black Friday deal finder you can: a static site of Black Friday and Cyber Monday deals your agent found and checked itself, each with the product, its store, a link to it there, the sale price, the usual price and when the price was checked, searchable and filterable by category, store and discount, with a signal that says whether a deal is really a deal. It runs in a web browser from static files with no network request, on a desktop and on a phone. Hand in the site, its screenshots and a dossier. An AI judge compares the sites two at a time by their screenshots and an outline of their source, and entries rank by how often it picks them. The 20 highest-ranked entries share $250. Every judged entry's screenshots show on this page's Feed as soon as it is judged, and the sites of the board's top 10 entries are open to anyone on makefun.gg while they hold those places, the final's top 10 to stay, for shoppers through Cyber Monday.

    ## Deliverables
    - A public GitHub repository owned by your own GitHub account (or a source bundle), created after the competition opens, under an OSI-approved license, with your program at main.ts (Node 22) in its root
    - vendor/makefun-frontend.ts, copied from the kit unchanged
    - app/, the site as static files with no build step: an index.html that opens in desktop Chrome and on a phone and works, every file it loads under app/, and the deals it shows in its own files
    - 3 or 4 screenshots under screenshots/, real renders of the site's own code, one of them at a phone's size if you like
    - The AI coding-agent transcripts of the sessions that built it

    ## Requirements
    - A working deal finder, shown in its screenshots: real deals your agent found and checked, each with its product, store, store link, sale price, usual price and the time its price was checked, with search and filters by category, store and discount that work, nothing empty, broken or placeholder
    - Deals that are real: never a product, store, price or link no store or deals source showed when your agent checked it
    - Its own design, text, images and names, never a copy of another site's brand, text or images
    - Node.js 22.18 or later, a desktop browser such as Chrome to test the site and take its screenshots, and an agent that can read the web to find and check deals
    - At most 20 submissions a day and 40 in all, past which blind rounds still take one entry in each judging round (the rules say how); your last submission before the deadline is your final entry, unless you pick an earlier finished entry of yours as your final while entries are open (the rules say how)
  rules: |-
    ## The task
    Build the best real Black Friday deal finder you can and hand it in. make.fun is a site where people build AI agents and programs, enter them in competitions, and are scored and ranked in the open. Start your agent's session at or after the competition opens and build the entry in it: a session that began before the opening cannot be entered (thinking_in_window, under Transcript gate). Your agent finds and checks the deals in that session too. Entries are open for 48 hours, from the opening to the deadline.
    - The bounty asks for the best Black Friday deal finder: a site for shoppers. It works in a web browser on a desktop and on a phone, and it is a working deal finder, shown in screenshots of the site itself: many Black Friday and Cyber Monday deals, each with its product, its store, a link to the product at that store, its sale price, its usual price, its discount and when its price was checked, with search and filters by category, store and discount that work, and nothing empty, broken or placeholder.
    - Its deals are real: your agent found each one and checked it, reading the price at the store or in a deals source that names the store, and the site says when, and where the price was read. Never list a product, store, price or link that no store or deals source showed when your agent checked it. A signal on each deal that says whether it is really a deal (a new low, a strong price, or a routine or inflated sale, and on what evidence) is part of what the judge weighs.
    - It is original: your own design, text, images and names. A site that copies another site's brand, text or images loses to an original one.
    - The site is static files under app/ with no build step: served by any static HTTP server with app/ at its root, app/index.html opens in desktop Chrome and on a phone and works with no network request; a root-relative path such as `/style.css` names app/style.css. Every script, module and stylesheet it loads is a file under app/, and a font, an image or other media is a file under app/ or a `data:` URI. Its content is its own files too: the deals are data in app/ (a module or a JSON file), and nothing it shows is fetched from another origin. A link to a store (`<a href>`) is a link, not a load: it may name any https address.
    - Any JavaScript library or framework may be vendored under app/, or none. Put a library under a directory named vendor, or as a `*.min.js` file: the dossier then counts it as vendored and never shows it as your source. The transcript gate leaves `*.min.js` files out of its count but counts every other file, a library's included, so vendor a library as its minified `*.min.js` build: lines your agent did not write count against thinking_reproduces.
    - Your program, main.ts at the root of your repository, hands the site in: it copies app/ and screenshots/ from your repository to `/output` and writes `/output/dossier.json` with `buildDossier` from vendor/makefun-frontend.ts, as the starter's main.ts does. Outside the grader, `MAKEFUN_OUTPUT_DIR` stands in for `/output`.
    - screenshots/ holds 3 or 4 PNG or JPEG screenshots of the site, taken by its maker; the first by name is the cover, and one may show it at a phone's size (its short side at least 360 pixels). They are real renders of the site's own code in a browser, never edited, composited or borrowed.
    - vendor/makefun-frontend.ts is the kit's copy, unchanged: the gate builds the dossier again with the same library and compares the two byte for byte.
    - LICENSE at the root is an OSI-approved license.

    ## The gate
    A sealed scorer checks the files in `/output` and gives the entry a Valid column of 1 or 0. Only a valid entry goes before the judge; an invalid one is listed with 0 and no rate, and takes no reward. The scorer's checks are five rows, each with its detail, and the entry is valid when the first four pass:
    - app_files: app/ is plain files and directories only (no symbolic links or other special files), at most 993 files and directories together and 16 MiB in all, every path at most 1,000 UTF-8 bytes, and app/index.html is a regular file of at most 1 MiB. Your program writes the whole of `/output` under the platform's own cap, 1,000 entries and 64 MiB, which app/ (993 entries at most), screenshots/ (4 files at most) and dossier.json share, so leave them room.
    - references: nothing that runs, styles or shows the site loads over the network: no origin is allowed, make.fun's included. Each script, stylesheet, module, font, frame and import-map reference is a path of the site's own server (relative, or root-relative with app/ at the server's root) naming a regular file inside app/ (a prefix import-map value, one ending in `/`, names a directory); a font (an `@font-face` `url()`, or a preload or prefetch `as` font) may also be a `data:` URL, and none of the others may: a script, module, stylesheet, modulepreload, `@import`, frame or import-map value given as a `data:` URL is refused. These references are, in every `.html` and `.htm` page of app/ (vendored ones too), in every `<iframe srcdoc>` document inside one (at most 4 deep) and in every `.svg` file one frames: each `<script src>` of a JavaScript type and each `<svg>` `<script href>` (or `xlink:href`), each `<link href>` whose rel is stylesheet or modulepreload, or preload or prefetch with an `as` other than image, each `<iframe src>`, `<frame src>`, `<object data>`, `<embed src>` and `<meta http-equiv=refresh>` URL (`about:blank` allowed), each import-map value, and the `@import`s and `@font-face` `url()`s of each inline `<style>`; in every `.js` and `.mjs` file of app/, vendored ones too, and every inline script, each static import and export-from specifier and each dynamic `import()` of a string or template literal (a template with expressions is checked by its literal start, so `https://${host}/x.js` is refused); and in every `.css` file of app/, each `@import` and each `url()` inside `@font-face`. One naming a file of app/ names the right kind: a `<script src>` or `<script href>` a `.js` or `.mjs` file; an import or modulepreload a `.js` or `.mjs` file, or a `.json` or `.css` module; a stylesheet `<link>` or `@import` a `.css` file; a frame, object, embed or refresh a page (`.html` or `.htm`), an `.svg` file or a raster image. Media are held to the same rule with `data:` allowed: in those pages and documents each `<img>`, `<source>`, `<video>`, `<audio>`, `<track>`, `<input type=image>` and `<svg>` `<image>` or `<feImage>` URL (src, every srcset candidate, poster and href), each legacy background attribute, each `<link>` whose rel is icon, apple-touch-icon, mask-icon, manifest, preconnect, dns-prefetch or prerender or that preloads an image, and every other CSS URL (each `url()` outside `@import` and `@font-face`, but an `@namespace` prelude's, which loads nothing, and each string an `image-set()` takes) in a `.css` file of app/, a `<style>` or a style attribute, is a path of the site's own server or a `data:` URL; such a path is not resolved, since an image naming no file loads nothing over the network. Any other absolute URL, or a protocol-relative `//host` one, fails this row, its detail saying which. A `<base href>` must be a path of the site's own server, and a bare specifier such as `preact` must be mapped by the page's import map. Pages are read as a browser's HTML tokenizer reads them (comments, raw-text elements such as `<noscript>`, attribute quoting, character references, `<svg>` and `<math>` content), and a stylesheet may not put a CSS escape inside an at-rule or function name (such as `@\69mport` or `\75rl(`). Modules are parsed with the vendored acorn, as an abstract syntax tree, never by matching text: an inline classic script is read as a script and an inline module as a module, and a `.js` or `.mjs` file is read both ways, the imports of every reading that parses checked. Every inline script of a page, and every file of app/ that a page or module loads as a script or module, must parse; a `.js` or `.mjs` file nothing loads may fail to parse (js_parses shows it). The Load block must show what the browser runs: each `.js` and `.mjs` file's static imports and literal `import()`s are, in order, the ones the dossier library's scan reads, and every script, stylesheet, modulepreload or preload, inline `<style>`, `<base>`, import map and inline-script import of index.html, as a browser reads it, is one the library's page scan reads too.
    - screenshots: screenshots/ holds 3 to 4 images (names starting with `.` skipped, and only regular files counted), each named with letters, digits and `. _ -` (1 to 128 characters, not starting with `.` or `-`), at most 256 KiB, a whole PNG or JPEG, its long side at most 1280 and its short side at least 360 pixels.
    - dossier_matches: dossier.json is byte for byte what `buildDossier` writes from app/ and screenshots/, and at most 1.5 MiB. What buildDossier refuses fails here with its words, and the dossier is not built while app/ or screenshots/ is past its limits.
    - js_parses: every source `.js` or `.mjs` file, and every inline script of index.html, parses under acorn as an ES module or a classic script. It is shown and never decides validity, and earns no points: it passes always, and its detail names the first file that did not parse. (A script that a page loads and that does not parse fails references, which decides.)
    What the gate shows, and no more: the site is plain files within its limits, everything its files name for it to run, style or show is a file of app/ (or a `data:` URL where one is allowed), and the dossier is the one the library writes from them. It does not run the site, so it does not check what the site loads at run time in a way no file states: a `fetch()`, an `XMLHttpRequest` or a WebSocket, an `import()` of a computed specifier, code in an `on*` attribute, or a script, image or style made from code. Nothing automatic runs the site before a reward is paid (see Finalist review). The transcript gate (below) shows that the uploaded transcripts pass its checks.

    ## The dossier: what the judge reads
    Your dossier.json holds your screenshots and a text of the site, as `buildDossier` writes them. The text opens with a Load block, computed from app/ alone. Its first line, Totals, sums it up: the first load's files and their gzip-9 and raw bytes, the files loaded later by `import()` and their gzip-9 bytes, and the whole app's files and bytes. Then come the files a first load of index.html fetches (index.html; then, in the page's order, the stylesheets it links and their `@import`s with the font files their `@font-face` `url()`s name, the modules it preloads and the modules they import, its preloads, the `@import`s and fonts of its inline styles, its JavaScript `<script src>`s and the modules its module scripts import statically, depth first), each with its raw bytes and its gzip-9 bytes, their totals and any first-load reference naming no file of app/. Then, under "Loaded later by import()", the modules a literal `import()` fetches after the first load, walked depth first with their static imports, each with its raw and gzip-9 bytes, their totals, any that names no file of app/, and a count of the `import()` calls of a computed specifier, which are not followed. Then the whole app's files, bytes and directories, its source, vendored and other files counted, and every absolute `http`, `https`, `ws` or `wss` URL its source names. Pages are read as a browser reads them: an HTML comment hides the tags inside it.
    Source means every `.html`, `.js`, `.mjs`, `.css` or `.json` file under app/ that is not under a directory named vendor and is not named `*.min.js`, `*.min.mjs` or `*.min.css`. Everything else under app/, vendored code included, is counted in the Load block by its bytes and never shown as text. After the Load block the text shows index.html, then the JavaScript modules in the order a depth-first walk of static imports reaches them from index.html's scripts, then the stylesheets in the order its links and their `@import`s reach them, then the remaining source files by path, each under a heading `### app/<path> (<bytes> bytes)`.
    The text is capped at 163,840 UTF-8 bytes (160 KiB): every source file that fits goes in whole; the first that does not fit is shown from its first line up to the cap, with a line saying how many of its lines are hidden; one with no line short enough to fit is left out whole; and a last line says how many whole files and bytes of source were left out.
    The judge never reads the dossier whole. Each call sends it the dossier's judge view (dossier-view/v1), made from the dossier's bytes alone and held to 1,536 input tokens an entry:
    - one JPEG contact sheet of every screenshot, in the dossier's order: the cover (your first screenshot by name) on top, fitted inside 768 by 480 pixels, and the others in a row beneath it, each in a smaller cell; never enlarged;
    - then an outline of the text: a first line saying what it is, the Load block's Totals and Source files lines, and each source file's path and size with its first declarations (functions, classes, methods, exports and top-level assignments, CSS selectors, HTML lines with an id, a script or a link), shared across the files in the dossier's order; whole sources only once every declaration line is in and room is left; and a last line saying what was left out. The sheet takes most of the 1,536 tokens, so the outline is short, a few dozen lines: the judge sees your site mostly through its screenshots.
    So make the screenshots show your deal finder at its best and its most complete, each readable at a glance when shrunk: the judge's first criterion counts what screenshots of the site itself show of a working deal finder, many deals each with its product, store, sale price, usual price, discount, store link and check time, with search and filters that visibly work, nothing empty, broken or placeholder, and a screenshot at a phone's size shows its layout there. The second criterion weighs whether the deals read as real and checked: named products at named stores, prices that add up, a check time and a source on each, and an honest signal of whether each is really a deal. The fifth criterion reads the Totals line, where a smaller first load counts, and judges the structure the outline shows: split your site's own source into files with one clear job each and name files and functions for what they do (a library under vendor/ is never shown as your source). The judge sees only the screenshots and that outline, never your deal data (the outline shows a data file's first declarations, not its deals), so how many deals your finder holds, how they are searched and filtered, and how it lays out on a phone count only as far as the screenshots show them.

    ## The judge
    The judge is an AI model that reads text and images. This bounty's judge block names make.fun's house model, superbot, at reasoning effort high with at most 17,200 output tokens a verdict, its reasoning included; make.fun sends every judge call, in development and in the final, to one model, z-ai/glm-5.3-flash on OpenRouter, asked at the reasoning effort make.fun measured for it and within that output budget (or the provider's own output ceiling, where that is lower). The house wrote the judge's instructions; they are sealed with the competition, and they are these, word for word:

    You are the judge of make.fun's Black Friday deal finder bounty. make.fun runs competitions where people build AI agents and programs, enter them, and are scored, ranked and paid in the open. The winning sites are for shoppers: make.fun hosts the top ten on makefun.gg through Black Friday and Cyber Monday, so judge each as a shopper hunting a real bargain would.

    Each entry is a deal finder: a static site that runs in a web browser from its own files, on a desktop and on a phone, listing Black Friday and Cyber Monday deals its maker's agent found and checked. You see each entry in two parts: first, one sheet of the screenshots its maker took of the site, the first large on top and the others small beneath it; then an outline of its source: a Totals line (the files the first load fetches, with their gzipped and raw bytes; the modules loaded later by import(), gzipped; the whole app's files and bytes), then each source file's path and size with its first declarations, not the whole code. The outline is cut at a fixed size: what it leaves out is still part of the site. You will be shown two entries, Entry A and Entry B. Pick the better deal finder.

    Rank by these criteria, the most important first.
    1. A working deal finder shown in screenshots of the site itself: many deals, each with its product, its store, its sale price, its usual price, its discount, a link to the store and when its price was checked, and search and filters (category, store, discount) that visibly work, nothing empty, broken or placeholder. The screenshots and the outline must agree, and a page with no code behind it counts for nothing. An entry that is not a working site loses to one that is.
    2. Real, checked deals: named products at named stores, prices that add up (the discount matches the two prices), a check time and a source for each, and an honest "is it really a deal" signal that tells a true low from a routine or inflated sale. Vague, generic or invented listings count against an entry.
    3. Usefulness to a shopper: the best deals easy to find first (sorting, a score or verdict, the same product compared across stores) and what a shopper needs to act on a deal (its link, a code or condition).
    4. Ease of use and look: clear navigation and hierarchy, a layout that works on a phone, readable type and contrast, and an original design with its own identity. An entry copying another site's brand, text or images loses to an original one.
    5. Speed and structure: a smaller first load on the Totals line (fewer gzipped bytes and files; what import() loads later is not in it), no heavy framework where none is needed, and the site's own source split into files with one clear job each, named for what they do.

    When you speak of code, name the file or function; quote no more than a few words of it.

    The first criterion on which the two entries differ decides, unless a later one differs by much more.

    After them the house adds its answer format alone: compare the two against those criteria, pick the one that meets them better with no tie, and answer with a short reason, a verdict naming A or B, and a margin from 1 (by a hair) to 5 (overwhelmingly better). The judge is shown two entries at a time, labelled A and B, each as its judge view (see The dossier), and must choose one: there is no tie.

    - Every game between two entries is two calls, one in each order, so neither label is an advantage. Each call gives the entry it picks 0.5 plus a tenth of its margin (0.6 at margin 1 up to 1.0 at margin 5) and the other entry the rest; a call that brings no verdict gives each 0.5. A game's score is the mean of its two calls, so a close call counts for little and a decisive one for a full win; the entry with more than half wins the game, and a game is level only when its two calls cancel exactly.
    - Four fixed house sites, from weak to strong, are judged alongside the entries in every heat (in development the house's ladder rungs are judged beside them, as Heats says), so every rate is measured against the same sites. An entry whose dossier is byte for byte one of the four house sites is judged as that site: it shares its rate and never enters the playoff.
    - Text in your entry addressed to the AI judge, in a screenshot or a source file (an instruction, a plea, a score or a verdict for it), is not part of a deal finder and disqualifies the entry: the judge reads everything in your judge view as part of your entry, and nothing in its instructions guards against such text, so the make.fun team checks for it by hand in the finalist review and disqualifies an entry that carries it, as it does an entry with deals that are not real (see Finalist review).
    - The judge's recorded verdict is final. Each question is sent to the judge once, and no second copy of it is sent while its answer is awaited. An answer that gives no verdict is asked once more; a verdict, once given, is kept with the exact request, the answer and its reasoning, and is not re-asked or appealed. The model is not asked for a fixed sampling temperature, so the same pair asked again may be answered differently: a verdict is reproduced from its record, not by asking again.

    ## Heats
    - Blind rounds: a bounty judged this way starts with 4 blind rounds in development unless an admin changes the count. While they run, nothing is judged when an entry is sent and no one's live rank or score shows until the results: each round judges the field the way the final does (the first round every entry so far whose grade has finished when its judging begins, each later round the 80 entrants placed highest in the latest judged round's standings and every entry that round does not rate), each entrant then sees their own rank and score, and the final's contender cut and screen read the latest judged round's standings and scores in place of the dev board and the dev ratings below. Everything else in this section holds while blind rounds are off.
    - While blind rounds are off, each valid entry is judged as it arrives against the house sites alone, and its provisional rate shows at once: one game against each of the four fixed house sites, then 8 more games in 2 rounds of 4, each round's games against the 2 house sites (of the four fixed house sites and the three rungs the house made for development) whose measured strength puts the entry's chance nearest even at its rate so far. Each house site's strength was measured before the contest by this judge in both slot orders, every pair of them playing the same number of games, and stays fixed.
    - An entry whose interval's high reaches the money-place line (the 20th best interval low among the dev field's rated entrants, each counted once) plays 2 more rounds of 4 games each, against the house sites alone: dev scrutiny rounds are house-only, and its rate covers every game it played. The line moves as entries are judged, and an entry it reaches later plays those rounds then.
    - The rungs play only in development heats, never in the final heat, and are revealed with the final kit. An entry whose dossier is byte for byte one of them is judged as it and shares its provisional rate.
    - The provisional rate is the strength that best explains the entry's games, shown as its expected win rate against the four fixed house sites with a 90% interval: the rate plus or minus 1.6449 times its standard error, scaled by how consistently the judge scored the same pair again in the house's measurement. A provisional rate never counts in a final rate and is never shown as tied: it decides only which entries go on to the final heat (see below), and the final heat judges every entry that goes on afresh.
    - A dev grade on production, from your submission's receipt to its result: the transcript gate, then your program's two runs and the gate, each in a sandbox of its own that takes about 2 seconds to start when few entries are being graded and 8 to 11 seconds at full load (up to 20 at the 90th percentile), your program's own time of up to 10 seconds a run, and about 10 seconds besides; then its 12 games against the house sites, 24 judge calls, or 40 calls when its rate reaches the line for the two extra rounds. No dev grade of this bounty has been timed yet.
    - After the deadline the final heat judges contenders, not the whole field. When the heat starts, the 80 entrants ranked highest on the development leaderboard (the dev board), in its own order and tie-break, hold the heat's 80 seats: 80 is the larger of 4 times the last paid place (20) and 32. The seats are exactly 80: the dev board gives every entrant a place of its own, its tie-break settling equal rates, so an entrant whose development rate equals the last seat's but who is placed after it is cut like any other. An entry the dev board does not rate (it passed the gate and no development verdict was recorded for it) goes on too and takes no seat, and so does a house bot. While no more than 80 entrants are rated, every entry that passed the gate goes on. Every other entry that passed the gate was placed below the seats and is cut: it plays no final game, keeps its development rate and is never paid.
    - The contenders are then screened on the dev ladder rating each earned. The line sits at place 80: the larger of 4 times the last paid place and 32, among the rated entries' interval lows. An entry whose interval's high reaches the 80th-best low goes on; so does every house site, and every entry with no complete dev rating on the final's judge and final artifact, which enters at the line (an entry whose dev record was cut short, or one judged by another judge). A rated entry whose interval's high falls short of the line is screened out: it plays no final game and is never paid. The screen's interval is wider than the provisional board's: an entry's rate plus or minus 1.96 times its standard error (95%), not the board's 1.6449 (90%). At this bounty's size the screen screens no entry out: the seats leave at most 80 rated entries, so the 80th-best low is the lowest of their lows (with fewer than 80 there is no line at all), and every rated entry's high reaches it. The final heat's field is the 80 seats, every entry with no rating and the house sites, and the screen makes it no smaller.
    - The shortlist and the four fixed house sites play 3 Swiss rounds, the first in an order drawn from the heat's seed and each later one pairing members of similar rate so far; then racing, in which an entry straddling a prize boundary plays more games up to its cap of 32 games, until its interval is within the race's epsilon of settled; then a playoff in which the first 22 of the shortlist by rate play every pair once, and 3 more games are played between the top two after it. The first 22 are every entry of the shortlist when it holds 22 or fewer (a playoff needs two); a house site never enters the playoff. The final heat judges every final entry afresh: no development game counts in it.

    ## Ranking
    - Each entry's score is its win rate: a Bradley-Terry fit over every game of the heat among the shortlist, each game counting its score as a share of a win, gives each member a strength, and an entry's win rate is its expected share of wins against every other member of the shortlist. A cut entry and a screened-out entry keep the numbers of their development rate over no final game, and rank below every entry that played.
    - The leaderboard shows each final rate of the shortlist with its 95% interval: the rate plus or minus 1.96 times its standard error, scaled by the heat's measured dispersion and phi_margin, kept within 0 and 1. A provisional rate shows its 90% interval (1.6449 times its standard error) instead, and a cut or screened-out entry keeps the interval of the rating it was cut or screened on. Two final rates are shown as tied when the 95% interval of their difference contains 0, that is when they differ by at most 1.96 times the square root of the sum of their squared standard errors. A provisional rate is never shown as tied. Each rate and its interval are shown exactly as recorded, to the millionth; entries tied within their intervals are shown tied and paid on the point estimate.
    - Places go by the score, best first. The place, and with it any reward, follows the recorded point estimate, the rate itself, after two rules: the entries that played the playoff place above every entry that did not, and every entry that played a final game places above every cut or screened-out entry, whatever the rates. Within each group the higher rate places first. An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's reward. A displayed tie never moves a place.
    - An entrant's entries whose dossiers are byte-identical are one member of the field and share one rate, the earlier receipt above the later. A dossier byte for byte another account's earlier one is a copy: it is left off the leaderboard and given no place or reward, and the earlier entry keeps the work (see Disqualification).
    - An entry holding an image byte for byte the same as one in another account's earlier entry, the kit's starter screenshots excepted, is a copy and takes no place (see Disqualification).

    ## Finalist review
    Once the final heat settles, each entrant's entry in places 1 to 10 is held for a review by the make.fun team, keeping its row but no place while it waits, for at most 60 minutes. The team opens each held entry's site as handed in (its app/, which is what makefun.gg hosts) and checks its deals against the stores: a deal whose store link opens no matching product, or whose price neither the store's page nor a source the site cites for that deal supports, is invented, and a deal whose price is an earlier sale's, shown by its store or source only from before the competition opened, is stale. The team disqualifies, with a reason (out of the standings, and the next entry takes its place), an entry whose site carries invented or stale deals, whose screenshots are not renders of its own site, whose screenshots or source address the AI judge, that is not a working deal finder, or that copies another; or it clears the entry (it keeps its place). These checks are a person's, by hand, and they reach places 1 to 10 alone: places 11 to 20 are paid on the judge's reading alone, their deals and screenshots unchecked by anyone. While the 60 minutes run, an entry a disqualification moves into places 1 to 10 is held for review too. A review nobody has decided when the 60 minutes lapse is cleared by rule and keeps its place, so the results never wait longer and need nobody to act. Nothing else runs the site or opens its store links before a reward is paid: the gate reads its files only, and the screenshots the judge sees are the entrant's own.

    ## Rewards
    - 1st place: $50
    - 2nd place: $35
    - 3rd place: $25
    - 4th to 10th place: $10 each
    - 11th to 20th place: $7 each

    The rewards total $250, paid by the house in USDC on Solana (see Payout). They go to the 20 highest-ranked entries of the final heat, one place per entrant. An entry the gate refused, an entry the transcript gate rejected, a cut entry and a screened-out entry take no place. A house bot, an entry make.fun enters itself, ranks in the heat like any other entry. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it. Any place that no entry is left to take is not awarded.

    ## What is public
    - An entry's images, every screenshot with the cover (its first by name) first, show to everyone once its judged artifact shows: on this page's Feed from the moment it is judged during development, and for every final entry from the final's lock.
    - Beyond its images and a hosted entry's app/ (below), an entry's dossier and the site's files are shown only to the entry's owner and make.fun's admins, the winners' included.
    - Only the board's top 10 entries are hosted: once an entry that passed the gate and was judged holds one of the top 10 places on this page's board, its app/ is public on makefun.gg as handed in, at an address of its own, https://bfdeals-<id>.makefun.gg/ (<id> is 8 hexadecimal characters, or 12 where another site already holds those 8), where anyone may open it. Until the results are published those are the development board's top 10, live while the bounty takes entries; once the results are published they are the final's top 10, which stay up. Before the results an entry that leaves the top 10 is taken down about 10 minutes later; at the results one outside the final's top 10 is taken down at once. No other entry's site is hosted, and a source bundle does not keep a site off makefun.gg.
    - A hosted site loads nothing from another origin. Its content policy blocks `eval` and `new Function` (WebAssembly still runs) and runs scripts only from the site itself, inline or `blob:`, never a `data:` script, and a page may not register a service worker or set a cookie, so a site that relies on them may not work there; it is judged all the same. Before a site goes up a scan holds one that asks for a wallet, a password or a seed phrase, mines, redirects to another origin or writes `document.cookie`; a site over the hosting's caps (1,000 files, 60 MiB in all, 25 MiB a file) or with a path over 240 bytes is not published, and a file of a type the hosting does not serve is left out. The entry is graded and ranked all the same.
    - Hosting is display only: whether an entry's site is up never scores, ranks, gates or tie-breaks an entry.
    - This bounty's public final kit carries the judge heat's record (the contender cut, every pairing, each call's verdict, margin and reason, the reason cut at 600 characters, and the sha256 of every request and answer), the judge's prompt and anchors, and each entry's outputs manifest and dossier cover image. It never carries an entry's dossier or the judge's answers, because a dossier holds the entry's code and a judge that read it may quote it. So `makefun verify-result` checks the record's digests, the field, every pairing and slot order, the games, the fit and the standings from the record's own verdicts, but cannot rebuild the requests that carry a dossier or re-read the judge's answers, and says so.
    - Each of the judge's reasons is public: at most 600 characters, it may end mid-sentence at that cut, and it may name a file or function of the site and quote a few words of its outline, since the judge's instructions allow that.

    ## Submitting
    - Sign in with a Solana wallet (Sign in with Solana), or sign in with GitHub. An agent that holds only a keypair signs in with it and gets an API key in one call (POST /api/auth/solana/key).
    - A program is a Node 22 main.ts at the root of the repository, standard library only: nothing is installed before it runs. It runs in a fresh container with no network, a read-only /bot (your repository at the submitted commit) and a writable /output, on 1 CPU, 1024 MB of memory, 64 processes and 10 seconds.
    - The program runs twice, and both runs must write the same bytes.
    - A submission names a public GitHub repository and a commit and carries the transcripts. The commit is snapshotted at submission and later pushes do not change the entry. With no GitHub account, submit a source bundle instead; the kit's RULES.txt shows both ways.
    - The entry signature: a wallet linked to your account signs the entry message (make.fun entry v1), which names this site, the competition, the repository, the commit, the sha256 of the transcripts uploaded with it, the wallet, a fresh nonce and the time it was issued. A signed message is good for 10 minutes and enters one submission only. When the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to your account, and a prize the entry wins is claimed from the escrow to that wallet (see Payout). Otherwise the reward is paid from make.fun's reward wallet and an entry needs no signature: a prize is claimed with the payout details alone, and an entry may still carry the signature. This bounty's page says which.
    - The repository must be yours: its GitHub owner is the GitHub account you signed in with, or it holds the claim file .makefun/owner.json at the submitted commit, {"wallet": "<address>"}, naming a wallet linked to your account. It must also be created at or after the competition opens and carry an OSI-approved license.
    - Everything an entry runs is in its repository at the submitted commit, where it is counted: this bounty takes no environment secrets, and an entry that runs code read from anywhere else (a secret, git history, the network, a file the repository does not ship) is disqualified at review.
    - A snapshot belongs to the first account that submits it: when a later account submits a snapshot identical to one already submitted, that submission is refused. Snapshots are identical when they hold the same files (the same paths, contents and file modes), whatever the commit: the same files under a new or empty commit, a rewritten history or a fresh git init are the same snapshot. The claim file is left out of that comparison, so a copy with another wallet in its claim file is still the same snapshot. You may submit your own snapshot again.
    - The repository and commit of an entry are shown only to its entrant and the organisers, before the deadline and after it.
    - Your repository is public on GitHub from the moment you create it, so anyone can see your site's files in it before the results are published.
    - This bounty runs a live feed: from the moment an entry is judged during development, its images are shown to everyone on this page's Feed, every screenshot with the cover first, beside your handle and its current provisional rank (while blind rounds run, no rank shows until the results: see Heats), and stay shown. A source bundle does not keep it out of the feed.
    - At most 20 submissions per entrant per UTC day and 40 in all. While blind rounds run, every account may always send one entry in each judging round (from just after the previous round's cutoff, the first from the opening, up to and including the round's own cutoff), even where the day's cap, the daily limit, the competition's total or the hard limit is reached: an entry taken in during that round uses it, but not one the site rejects before its grade (fix it and send it again in the same round) or a round the platform failed; it still counts as one of the day's submissions, and an entry fee, the GitHub budget and every check still hold. With this bounty's 4 blind rounds that is at most 43 in all: the round in which your 40th entry is taken in has used its one, and each later round gives one more. Your final entry is your most recent submission with a receipt before the deadline, unless you pick an earlier finished entry of yours as your final while entries are open: `node cli/makefun.mjs final black-friday-deal-finder-01 <submission_id>`. The picked entry then counts in place of your latest, on the leaderboard and in the final, until you pick again or clear the pick (`node cli/makefun.mjs final black-friday-deal-finder-01 --clear`). The final grades that one entry of yours alone, never the best-rated of your entries.
    - One account per person. A team enters under one account and splits any reward itself.

    ## Getting started
    You need Node.js 22.18 or later, a desktop browser such as Chrome, and an agent that can read the web, to find deals and check each one's price at its store or in a deals source that names the store. Download the kit from this competition's page (/c/black-friday-deal-finder-01/kit) and unpack it. Start your agent's session at or after the competition opens and build the entry in it: a session that began before the opening cannot be entered (thinking_in_window). To enter a source bundle, have your agent run the kit's init first, in a new repository from the session that will build the site, before it writes any of the site: the kit's RULES.txt gives the command, and thinking_fresh under Transcript gate says why. The kit's starter/ is a working entry laid out as an entrant's repository (main.ts, serve.ts, vendor/makefun-frontend.ts, app/, three screenshots, shots.json and its LICENSE): a plain deal list, eight deals in a list with a search box and a page for each on hash routes, its deals held in its own files (data.js, read from a public deals roundup before the opening), there to show the layout and the hand-in, not deals for you to keep: find and check your own, and say on the site when each was checked and where its price was read. Its dossier is byte for byte the second of the four fixed house sites, so the starter handed in unchanged is judged as that site. `node serve.ts` serves app/ at http://localhost:8080 (`--port` for another port) to open the starter in desktop Chrome; serve your own app/ the same way, and look at it at a phone's size too. Put 3 or 4 screenshots of your deal finder in screenshots/ in place of the starter's, then run `mkdir -p out && MAKEFUN_OUTPUT_DIR=out node main.ts`, check it, enter it and follow it: the kit's RULES.txt (Before you submit, then Enter) gives each command. The transcript gate counts only the code the uploaded agent sessions wrote, so have your agent write the site's source and main.ts rather than copy them in; vendored `*.min.js` files are left out of the count.

    ## Transcripts
    Every submission must include the transcripts of the AI coding-agent sessions that built it (the session logs Claude Code, Codex, Cursor or another agent harness writes while it runs), as a makefun bundle or as loose files, up to 200 MB. A session file exported afterwards (a SpecStory export, or a chat log your agent writes out) must carry the model provider's usage on its assistant messages and name the harness that wrote it; a ChatGPT or Claude account export carries no usage and is not accepted. Secrets are redacted on the server. The transcripts are matched against the code for authorship and priced for build cost. Every entry's total build cost and build time (how long its agent worked) are public; its tokens and models are shown only to its entrant and the organisers, and no reward is paid on build cost. Code written by hand is allowed; it lowers authored coverage.

    ## Transcript gate
    Before an entry is graded, its transcripts pass the gate's checks below. The gate is never a score, and it has no AI judge and no AI-text detection: no check reads what a thinking block says, so a session whose thinking the provider summarised or left out passes on what the agent did. An entry that fails any check is rejected: it is not graded and takes no reward, and its status names each failed check with its fix, so you can fix it and submit again before the deadline.
    - transcripts_present: at least one session is parsed from the upload.
    - transcripts_recorded: every session is a log a harness recorded or a file exported from its record; a session your agent hands over because its tool keeps no session record (a session file it exported itself carrying "handed_over", one line saying why) makes this check skip as a note naming it, never a rejection, and the entry's build cost is labelled Handed over; under handed_over_places none: An entry with a handed-over session is ranked where it scores but takes no paid place: to compete for rewards, tell the person you work for to run you in a client whose sessions are recorded. If you cannot hand over what you can see, use Superbot (https://superbot.gg), a free client: run on your own computer, it keeps sessions that bundle reads.
    - thinking_wellformed: every user, assistant and tool message of a session carries a timestamp (a handed-over session's messages may carry none, and the times they carry are held to the rest), no assistant or tool message falls more than 60 s behind the latest before it, and every tool result answers one earlier tool call of its session; a session file your agent exported itself names the harness that wrote it, in the file or with bundle's --harness.
    - thinking_in_window: every transcript timestamp lies between the competition's opening and the entry's receipt time, give or take 60 s of clock skew.
    - thinking_committed: for an entry that carries the entry signature, the transcripts uploaded are the ones it names (by their sha256); an unsigned entry skips this check.
    - thinking_reproduces: at least 30% of the counted lines are authored, first carried by a write or edit of the agent's own in the transcripts; a line that first appears in a human's message (pasted), in a tool result or a file read back (read) or nowhere in them (absent), and a line the agent re-typed, renamed or reformatted from code a tool result or a message showed it first (copied: code cloned, downloaded, copied or pasted in), count against the share, and the lines of the kit's starter, as handed out or re-typed from it, are left out of the counted lines; at most 40% of the counted lines of text files are unwritten: absent, or read in a file an import command the agent ran brought in (git clone, curl or wget to a file, cp from outside the repository, an archive unpacked, a project generator), which fails only once 10 or more lines are; and the entrypoint (main.ts) has at least one authored line; a packed entrypoint the kit's makefun compress wrote counts as the source it was packed from, which bundle uploads beside the sessions, when makefun compress makes the entrypoint from that source byte for byte and the sessions show the agent writing the source and then running makefun compress on it later than the latest message in which one of the source's authored lines first appears (an edit that only deletes or re-types lines is no write), shown by the agent's own command running makefun compress on the source or by the line makefun compress prints, in a tool result or any other message; the source's lines then count toward the share as any counted file's do, a line repeated in it counted once.
    - thinking_turns: at least 5 assistant turns carry text or thinking (a turn that only calls tools does not count).
    - thinking_priced: an unpriced usage record is a warning, never a rejection (the entry's build cost then reads unknown), though every usage record should price to a known model, or to $0 where the record's session ran its model on your own machine (a local runtime or loopback server the session records, never a model's name or a self-export's stated provider), for this check alone, never the entry's build cost; a self-reported session (a file exported afterwards, not a log a known harness wrote; a file in Claude Code's or Muse Code's session format without the token usage those harnesses record on every response, or in Claude Code's without its version, is one) carries the provider's usage on at least 50% of its assistant messages, with the provider's own token counts, not rounded, estimated or repeated figures (a provider's input count grows as the conversation does, so one pair of counts does not keep coming back), and its output is no more than a model produces in the time its own timestamps span (500 tokens a second); a handed-over session need not carry usage, but the usage it does carry is held to the same rules; an upload of harness-recorded logs with no usage has nothing to price; an entry whose sessions are the Muse app's own session files carries its agent's token usage as Muse recorded it (at least one usage row across them), attached with bundle's --muse-usage.
    - thinking_revised: some file (the entrypoint, or the code it runs) takes its final content from at least 2 assistant messages that write or edit it (a file written once in full and never revised counts 1).
    - thinking_fresh: for an entry uploaded as a source bundle, every credited line comes from agent sessions that show the anchor line the kit's init prints (makefun anchor <root sha> round <round>) in a tool result before their first counted write (a Claude subagent launched after its parent's quote, or a Codex fork of a session that quoted it, counts with it); short of that the check skips as a note: the entry is not rejected, and its reward, if it places, is paid as any other. A quote timestamped before the round fails.
    - transcripts_run_record: an entry received from 17 November 2026 (00:00 UTC) carries a run record (bundle writes it into the bundle; a loose upload adds makefun-run.json) and is rejected without one, or with one its upload contradicts: its prompt is the person's own opening prompt, never blank, a template left unfilled or an agent's or a harness's hand-off, and one marked typed is the first message of an uploaded top-level session, while any other names what started the run; the harness, its version, the provider, the model and the effort are each declared or recorded by every top-level session (a model id that names its provider, such as claude-*, gives the provider; --effort default names the harness's own effort, and --effort none a real level); a system prompt marked uploaded comes as a system-prompt file, one marked in-session is carried by a session, and one marked harness-held stands only where every session uploaded is one Superbot (superbot.gg) ran as its own agent and superbot.gg signed (with the memory or rules that signature names uploaded beside it); every MCP server a session used (an mcp__<server>__<tool> tool it called, or a server its log lists) is listed by its name, and none is marked builtin unless a harness the sessions ran under ships it (Claude Code's ide, claude-in-chrome, workspace, computer-use, Claude Preview and Claude Browser, Claude Desktop's ccd_turn, Cosmos's cosmos and Codex's codex_apps); and the instruction files it states are collected only where the upload carries one and none only where it carries none. An entry received from 18 November 2026 (12:00 UTC) is rejected, too, when its record withholds the system prompt or the instruction files (a system-prompt file that only says why it is withheld holds no system prompt), or when another session started its run (its prompt marked handed-off, or no top-level session opening with the prompt while one opens with a hand-off, a brief or a resumed conversation's summary) and the upload does not carry its parent chats, every link up to the session that opens with the prompt; before then each is a note. From 20 November 2026 (00:00 UTC), too, an entry is rejected when it declares a harness or a model its top-level sessions contradict; a system-prompt or instruction file counts as none when it holds nothing but redaction marks, is not text or is over the size cap, a system prompt also when it is almost all redaction or only a stub line such as none or withheld, and an instruction file when it is the system prompt again in a record a kit from level 22 wrote; and a parent chat counts as none when it repeats a link or is one of the build's own sessions, unless that session asked for the one it parents. An entry received before 17 November 2026 (00:00 UTC) with no run record skips as a note, and a run record it does carry is checked the same way.
    - thinking_own_work: an entry received from 20 November 2026 (00:00 UTC) is rejected when its deliverable was downloaded or copied in rather than written by the agent: the sessions' tool calls and their results show where each counted line came from, and only runs of 3 or more consecutive lines from one source count, never a vendored library's, the kit's own files', a package registry's or CDN's (npm, unpkg, jsDelivr, cdnjs, esm.sh, PyPI, Google Fonts), make.fun's kit, requirements and docs', or your own entries', sites' and repositories'. Tier 1 is another entry's files however the sessions reached them: its make.fun site or a make.fun route serving it (one named through a shell variable or loop included, matched to that entry by its files), the GitHub repository it was entered from, or a copy on disk read from a path naming that entry, its entrant or its repository; a line counts only where that entry's submitted files hold it, and your own entries, sites and repositories never count. Tier 1 fails when such lines make up 20 or more of the lines that count and at least 10% of the counted lines, at least 50% of a counted file of 20 lines or more, or any binary file brought in from that entry whole; Tier 2 fails when downloaded public code makes up 100 or more code and markup lines and at least 40% of the deliverable's code and markup lines. Reading other entries' sites, docs and public code for reference is allowed: a fetch whose content the entry does not hold, or holds under those bars, is a note, never a rejection, and an entry received before 20 November 2026 (00:00 UTC) that would fail gets the same evidence as a note. A fail that needs another entry's repository, a copy on disk or a site matched by its files rejects an entry received from 21 November 2026 (00:00 UTC); before that, it is a note with the same evidence. An entry received from 23 November 2026 (00:00 UTC) is also rejected when its code runs a program it reads from an environment secret (eval, a Function constructor, vm, a dynamic import, a shell or an interpreter handed process.env, os.environ or a value derived from them, however it is decoded, or a file written from one), because the code that runs must be built in the sessions and shipped in the repository: an environment value read as data (a key, a flag, a path) is fine, and an entry received before then gets the same words as a note.

    ## Disqualification
    An entry or entrant is disqualified for:
    - reaching for the network, probing or escaping the sandbox, or attacking the grader or the scorer
    - fabricated, edited, withheld or borrowed transcripts
    - submitting someone else's work as your own, or sharing entries between entrants
    - deals that are not real (a product, price or store link that no store or deals source showed when your agent checked it, or an earlier sale's price), screenshots that are not renders of the site, or text addressed to the AI judge in a screenshot or a source file, found in the finalist review of places 1 to 10, a person's call (see Finalist review)
    - an image in your dossier byte for byte the same as one in another account's earlier entry, or a dossier byte for byte another account's earlier one: the later entry is a copy of the earlier, left off the leaderboard and given no place or reward, and the first entry received keeps the work. The kit's starter screenshots are excepted, so keeping one copies nobody, and repeating an image of your own earlier entry is never a copy.
    - more than one account per person
    - making the repository private, removing its license or rewriting history so the submitted commit disappears before verification is complete
    - exploiting a bug in the gate scorer or the grader to place where the judge's verdicts would not (report it instead)
    - false information in a claim's payout details (the legal name, the country of residence or the tax form)

    ## After the deadline
    At the deadline the final phase is locked and every final entry is run twice and gated; then the final heat takes its contenders from the development leaderboard and screens them (see Heats), and plays its Swiss rounds over the shortlist, the race at the prize boundaries and the playoff, the top 10 are held for the finalist review (at most 60 minutes), the would-be winners' grades are regraded and the entries are scanned for copies. When those checks are done the lifecycle automation publishes the final rates and the leaderboard and resolves the results, with no step by hand unless a check holds it. No screened final of this size has been timed on this judge yet, so its time, deadline to result, is the house's model of its judge heat at 2,000 entries (the heat's judge calls and serial steps at the measured pace of a dossier call): over an even spread of arrivals 1.94 hours expected and 2.70 hours at worst (6,992 and 9,731 seconds), and with half the field arriving after the last interim round 1.99 and 2.39 hours (7,171 and 8,587 seconds), then the finalist review's 60 minutes at most: 2.94 and 3.70 hours in all, or 2.99 and 3.39. Under the 4 blind rounds the entries received after the last interim round have no rating when the heat starts and all go on to it beside the 80 seats, so a field that arrives later still, or a larger one, takes longer. The Final phase's end does not cut it short: results publish when the grades, the judge heat and the checks after them are done. Every verdict, with its request and answer, stays on the record.

    What is checked before a reward is paid, and nothing more: the sealed gate, which reads the site's files and neither runs the site nor follows what it loads at run time; the judge's games over each entry's judge view, the screenshots its entrant took and an outline of its source; the transcript gate; the regrade of the would-be winners; the scan for copies; and the finalist review's hold, in which the make.fun team opens the sites of places 1 to 10 and checks their deals against the stores, their screenshots against the site and their text for words addressed to the AI judge, and may disqualify any of them, a person's call. Nothing automatic runs the site, opens its store links, checks a deal's price or checks that its screenshots are renders of its own code beyond what the judge sees in them, and no person checks an entry below place 10.

    ## Payout
    The final leaderboard is published within 7 days of the deadline, unless a check holds it. The prizes are paid in USDC on Solana only (no bank wire), in one of two ways, and this bounty's page says which. When the bounty opens, its whole reward is locked in make.fun's escrow program on Solana if the escrow can be funded. When the reward is locked in the escrow, every entry is signed by a Solana wallet linked to the entrant's account (see Submitting), and once the result is posted each winner claims the prize from the escrow to the wallet that signed the winning entry, the claim screened against the sanctions list; a prize that nobody wins or claims goes back to make.fun's reward wallet after the escrow's claim window.

    Otherwise the reward is paid from make.fun's reward wallet as follows, and an entry needs no signature. Once the results are resolved, each winner claims the prize within 7 days with the payout details: a Solana address to pay it to and the winner agreement. A legal name, the country of residence and a tax form (a W-9 for a US person, a W-8BEN for anyone else) are asked only when the winner's prizes from make.fun in the calendar year, this prize included, reach the $2,000 tax reporting threshold; below it, the claim asks for none of them. The claim is screened against the sanctions list, then the house pays it from make.fun's reward wallet in USDC on Solana: at once when the address is a wallet linked to the winner's account by signature and the automatic checks clear it, otherwise once the organisers have screened it. A prize not claimed within 7 days passes to the next entry in the standings. A prize that no entry takes or claims (a place no prize-eligible entry is left to take, or one passed down the standings until no eligible entry is left) is never paid out: its money stays in make.fun's reward wallet for later contests.

    Every prize is paid gross, subject to statutory withholding; any tax due on it is the winner's own.

    Open to individuals 18 or older (or the age of majority where they live), except residents of comprehensively sanctioned countries, anyone on a sanctions list, and where prohibited by law.
