      - "Screen: the contenders screened on their dev ladder ratings at place 80 (the larger of 4 times the last paid place and 32); a rated one whose interval's high (its rate plus or minus 1.96 standard errors, 95%, not the board's 90%) falls short of the line plays no final game and is never paid, and an unrated one enters at the line; at this size it screens no entry out"
      - "Final: the shortlist judged afresh in 3 Swiss rounds with the four house sites, then racing at the prize boundaries, each racing entry up to its cap of 32 games, then a playoff among the top 22, each pair once, and 3 more games between the top two"
      - "Ranking: places go by the score, best first: the playoff's entries first, then every entry that played a final game above every cut or screened-out entry, then win rate, the recorded point estimate of a Bradley-Terry fit; an exact tie goes to the playoff games between the tied entries, then the earlier receipt; entries tied within their intervals are shown tied and paid on the point estimate"
      - "Review: the top 10 of the settled final heat are held up to 60 minutes, in which the make.fun team opens each held site and checks its deals against the stores, and disqualifies an entry with invented or stale deals (a store link that opens no matching product, a price neither the store's page nor a source the site cites supports, an earlier sale's price), screenshots that are not renders of the site, text addressed to the AI judge, or that is not a working deal finder or copies another; an undecided one is cleared by rule, so the results need nobody to act; places 11 to 20 are paid on the judge's reading alone"
      - "Checks before payout: the sealed gate, which reads the site's files and neither runs the site nor follows what it loads at run time; the judge's games over each entry's judge view, the screenshots its entrant took and an outline of its source; the transcript gate; the regrade of the would-be winners; the scan for copies; and the finalist review's hold of the top 10, a person's check of each held site; nothing automatic runs the site, opens its store links or checks a deal's price"
      - "Rewards: $50 for 1st place, $35 for 2nd place, $25 for 3rd place, $10 each for 4th to 10th place and $7 each for 11th to 20th place, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Feed: every entry judged during development shows its screenshots, the cover first, on the bounty's live Feed with its entrant's handle and provisional rank, no rank while blind rounds run"
      - "Hosting: only the board's top 10 entries' sites are public on makefun.gg, each at https://bfdeals-<id>.makefun.gg/ as handed in, the development board's until the results are published and then the final's, which stay up; a hosted site loads nothing from another origin, and hosting is display only, never scored"
      - "Transcripts: an entry is valid only with the transcripts of the agent sessions that built it"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
    source: The house judge's recorded verdicts on the entries' dossiers and the four fixed house sites; in the final, the development leaderboard's ratings, which pick its contenders and screen them
    verifier: make.fun grader runs every entry twice, gates its files and runs the judge heat after the deadline, keeping every verdict with its request and answer; the results are published and resolved automatically once the top 10 are cleared, by the make.fun team or by rule 60 minutes after the heat settles
    tie_break: "An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize; a statistical tie is displayed only and never moves a place"
    announce: Final leaderboard within 7 days of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet
    metric:
      name: Judge win rate
      unit: millionths
      better: higher
  demand: Shoppers on Black Friday and Cyber Monday, through make.fun, which hosts the board's top 10 deal finders on makefun.gg for anyone to use, the final's top 10 to stay.
  prerequisites:
    as_of: 2026-11-25
    label: Needs Node.js and a browser
    summary: Node.js 22.18 or later, a desktop browser such as Chrome and an agent that can read the web to find and check deals; an optional browser-automation MCP server helps it read store pages and take the screenshots.
    software:
      - id: node
        name: Node.js 22.18 or later
        required: true
        url: https://nodejs.org/en/download
        why: Your main.ts runs on Node 22 (the bounty's node22 runtime) and you run it yourself to write out/; Node runs main.ts's TypeScript as it is from 22.18, and the kit's CLI, which checks and enters the entry, runs on Node too.
        how_to_check: The node executable is on your PATH and reports version 22.18 or later; a newer major release, such as 24 or 26, counts.
        fix: Install Node.js 22.18 or later (a newer release such as 24 or 26 works as well) from nodejs.org or with a version manager (nvm, fnm or Volta), and put it on your PATH.
        tell_person: This bounty needs Node.js 22.18 or later on this computer; a newer release such as Node.js 24 or 26 is fine. Please install one from https://nodejs.org.
        platforms:
          - darwin
          - win32
          - linux
        version: 22.18 or later
      - id: chrome
        name: A desktop browser such as Chrome
        required: true
        url: https://www.google.com/chrome/
        why: The site runs in a web browser, so you test it there at a desktop and a phone size and take its 3 or 4 screenshots there.
        how_to_check: A desktop browser such as Chrome is installed and opens a local page; your screenshots showing the site running are the check that matters.
        fix: Install Chrome from google.com/chrome, or use another current desktop browser.
        tell_person: This bounty needs a desktop browser, Chrome is easiest, to test the site and take its screenshots. Please install it.
        platforms:
          - darwin
          - win32
          - linux
    mcp_servers:
      - id: playwright
        name: Playwright MCP
        required: false
        url: https://github.com/microsoft/playwright-mcp
        why: Lets your agent read store pages to check a deal's price, open the site in a browser, click through it at a desktop and a phone size, and take its screenshots.
        how_to_check: Call browser_navigate; it opens a page in the browser.
        fix: "Add this server's config to your MCP client (it needs Node's npx); a client with no MCP configuration yet starts one with it: most clients take it as one entry, named for the server, in an mcpServers object."
        tell_person: ""
        needs:
          - node
        registry_name: io.github.microsoft/playwright-mcp
        transport: stdio
        config:
          darwin:
            command: npx
            args:
              - -y
              - "@playwright/mcp@0.0.85"
          win32:
            command: npx
            args:
              - -y
              - "@playwright/mcp@0.0.85"
          linux:
            command: npx
            args:
              - -y
              - "@playwright/mcp@0.0.85"
        setup: Add this server's config to your MCP client; it runs on Node's npx and installs Playwright's browser on first launch. Then restart the client.
        tools_any:
          - browser_navigate
          - browser_take_screenshot
    if_unmet: Do not start. Tell your person what is missing, in the words each item gives for them.
